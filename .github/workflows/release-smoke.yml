name: Release smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  integration-smoke:
    name: Integration smoke (Edge + Snagit + scheduled task)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Load dependency versions
        shell: pwsh
        run: ./.github/scripts/Set-DependencyEnvironment.ps1

      - name: Cache Pester
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .psmodules
          key: psmodules-${{ runner.os }}-pester-${{ env.PESTER_VERSION }}

      - name: Install Pester
        if: steps.modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $null = New-Item -Path .psmodules -ItemType Directory -Force
          Save-PSResource -Name Pester -Version $env:PESTER_VERSION -Path .psmodules -Repository PSGallery -TrustRepository

      - name: Pester Integration tests
        shell: pwsh
        run: |
          Import-Module "./.psmodules/Pester/$env:PESTER_VERSION/Pester.psd1"
          $config = New-PesterConfiguration
          $config.Run.Path = '.\tests\EvergreenAdmx.Integration.Tests.ps1'
          $config.Run.Exit = $true
          $config.Filter.Tag = @('Integration')
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = '.\tests\TestResults.Integration.xml'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Upload integration test results
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-integration-results
          path: tests/TestResults.Integration.xml
          retention-days: 7
