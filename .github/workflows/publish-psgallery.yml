name: Publish to PSGallery

# Publishes EvergreenAdmx.ps1 as a PowerShell Gallery *script* (Install-Script / Install-PSResource).
# One-time setup: add repository secret PSGALLERY_API_KEY (NuGet API key from
# https://www.powershellgallery.com/account → API Keys) with Publish permission for EvergreenAdmx.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate metadata and WhatIf publish only (do not upload)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: psgallery-publish
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    uses: ./.github/workflows/release-smoke.yml

  publish:
    needs: smoke
    if: ${{ !cancelled() && (needs.smoke.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dry_run && needs.smoke.result == 'skipped')) }}
    name: Publish-Script
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the same event commit as the smoke gate, even if a release tag moves.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Load dependency versions
        run: ./.github/scripts/Set-DependencyEnvironment.ps1

      - name: Ensure PowerShellGet is current
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # PowerShell 7 includes NuGet support; its legacy provider bootstrap feed is unavailable.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name PowerShellGet | Where-Object Version -eq ([version]$env:POWERSHELLGET_VERSION))) {
            Install-PSResource -Name PowerShellGet -Version $env:POWERSHELLGET_VERSION -Scope CurrentUser -Repository PSGallery -TrustRepository
          }

      - name: Validate script metadata and version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $scriptPath = Join-Path $PWD 'EvergreenAdmx.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath)) {
            throw "EvergreenAdmx.ps1 not found at $scriptPath"
          }

          $info = Test-ScriptFileInfo -Path $scriptPath
          $info | Format-List | Out-String | Write-Host
          $version = [string]$info.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'PSScriptInfo .VERSION is missing or empty.'
          }

          $tag = $env:RELEASE_TAG
          if (-not [string]::IsNullOrWhiteSpace($tag)) {
            $normalizedTag = $tag.TrimStart('v', 'V')
            if ($normalizedTag -ne $version) {
              throw "Release tag '$tag' does not match script version '$version'. Update <#PSScriptInfo> .VERSION before publishing."
            }
          }

          Write-Host "Script version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Skip if version already on PSGallery
        id: existing
        env:
          SCRIPT_VERSION: ${{ steps.meta.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION
          $version = $env:SCRIPT_VERSION
          $found = Find-Script -Name EvergreenAdmx -RequiredVersion $version -Repository PSGallery -ErrorAction SilentlyContinue
          if ($found) {
            Write-Host "EvergreenAdmx $version is already on PSGallery — skipping publish."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Publish to PowerShell Gallery
        if: steps.existing.outputs.skip != 'true'
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SCRIPT_VERSION: ${{ steps.meta.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $dryRun = $env:DRY_RUN -eq 'true'
          $scriptPath = (Resolve-Path '.\EvergreenAdmx.ps1').Path

          if ($dryRun) {
            Write-Host 'Dry run: Publish-Script -WhatIf'
            Publish-Script -Path $scriptPath -NuGetApiKey '00000000-0000-0000-0000-000000000000' -WhatIf -ErrorAction Stop
            Write-Host 'Dry run completed (no upload).'
            return
          }

          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw 'Repository secret PSGALLERY_API_KEY is not set. Add it under Settings > Secrets and variables > Actions.'
          }

          # PowerShellGet can Write-Error from nested scopes; -ErrorAction Stop is required.
          Publish-Script -Path $scriptPath -NuGetApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
          Write-Host "Published EvergreenAdmx $env:SCRIPT_VERSION to PSGallery."

      - name: Confirm publication
        env:
          SCRIPT_VERSION: ${{ steps.meta.outputs.version }}
        if: |
          steps.existing.outputs.skip != 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION
          $version = $env:SCRIPT_VERSION
          $found = $null
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            $found = Find-Script -Name EvergreenAdmx -RequiredVersion $version -Repository PSGallery -ErrorAction SilentlyContinue
            if ($found) { break }
            Write-Host "Attempt $attempt/8: version $version not visible yet..."
            if ($attempt -lt 8) { Start-Sleep -Seconds 5 }
          }
          if (-not $found) {
            throw "Publish appeared to succeed but EvergreenAdmx $version is not visible on PSGallery after ~35s. Check https://www.powershellgallery.com/packages/EvergreenAdmx/$version"
          }
          Write-Host "Confirmed: EvergreenAdmx $version is on PSGallery"
          Write-Host "https://www.powershellgallery.com/packages/EvergreenAdmx/$version"
