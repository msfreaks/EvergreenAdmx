name: Bug report
description: Something is broken or unexpected while running EvergreenAdmx
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out every required field so we can reproduce the issue quickly.

        Collect environment details with:

        ```powershell
        $PSVersionTable.PSVersion
        Select-String -Path .\EvergreenAdmx.ps1 -Pattern '^\.VERSION'
        # Gallery install: (Get-InstalledScript EvergreenAdmx).Version
        ```

        Re-run the failing command with `-Verbose` and paste the output below.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please search existing issues before filing a new one.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command line you ran.
      placeholder: |
        1. Run `.\EvergreenAdmx.ps1 -Include '...' -Verbose`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
      description: What did you expect, and what actually happened?
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true

  - type: input
    id: powershell-version
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion` (Windows PowerShell 5.1 or PowerShell 7+).
      placeholder: "7.4.6"
    validations:
      required: true

  - type: input
    id: evergreenadmx-version
    attributes:
      label: EvergreenAdmx version
      description: Script `.VERSION` value (for example `2607.1`), or `(Get-InstalledScript EvergreenAdmx).Version`.
      placeholder: "2607.1"
    validations:
      required: true

  - type: input
    id: products
    attributes:
      label: Products / -Include
      description: Which products were included when the issue occurred? Leave blank if you used the default set.
      placeholder: "Windows 11, Microsoft Edge, Microsoft FSLogix"

  - type: textarea
    id: verbose-output
    attributes:
      label: Verbose output
      description: Re-run with `-Verbose` and paste the full relevant output (or link a gist for very large logs).
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Optional — PolicyStore path, OS build, screenshots, or anything else that helps.
    validations:
      required: false
